name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm = linux/aarch64, the same arch as an NVIDIA DGX Spark
        # (GB10) — keeps `pip install novomcp-lite` verified on arm64, not assumed.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (offline — chem + registry)
        run: pytest -q -m "not network"
